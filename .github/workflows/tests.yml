name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v

  portable-exe:
    name: windows-portable-exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and build extras
        run: python -m pip install -e ".[build,theme]"
      - name: Build portable EXE
        run: pyinstaller --noconfirm --clean SwitchRefreshConfigurationImportTool.spec
      - name: Stage portable ZIP
        shell: pwsh
        run: |
          $name = "SwitchRefreshConfigurationImportTool-visual-port-map-windows-x64"
          $stage = Join-Path "portable" $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "dist/SwitchRefreshConfigurationImportTool.exe" $stage
          Copy-Item "examples/generic_existing_switch_config.txt" $stage
          Copy-Item "examples/generic_refresh_build_template.txt" $stage
          Copy-Item "LICENSE" (Join-Path $stage "LICENSE.txt")
          @(
            "Switch Refresh Configuration Import Tool - portable tryout",
            "",
            "1. Unzip this folder anywhere.",
            "2. Run SwitchRefreshConfigurationImportTool.exe.",
            "3. Open the Target Build Planner tab.",
            "4. Click Open Port Map.",
            "",
            "This build is from the visual port-map branch, not a numbered GitHub Release.",
            "Generated output is review material only. The tool does not connect to devices."
          ) | Set-Content -Encoding utf8 (Join-Path $stage "QUICK_START.txt")
          Get-FileHash (Join-Path $stage "SwitchRefreshConfigurationImportTool.exe") -Algorithm SHA256 |
            ForEach-Object { $_.Hash.ToLower() + "  SwitchRefreshConfigurationImportTool.exe" } |
            Set-Content -Encoding ascii (Join-Path $stage "SHA256SUMS.txt")
          New-Item -ItemType Directory -Force -Path "release-upload" | Out-Null
          Compress-Archive -Path $stage -DestinationPath ("release-upload/" + $name + ".zip")
      - uses: actions/upload-artifact@v4
        with:
          name: SwitchRefreshConfigurationImportTool-visual-port-map-windows-x64
          path: release-upload/*.zip
          if-no-files-found: error
